server:
  port: 8888

spring:
  application:
    name: aiplane-config-server
  profiles:
    # native | jdbc | git — driven by CONFIG_MODE / SPRING_PROFILES_ACTIVE in Compose
    active: ${CONFIG_MODE:native}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: when_authorized
    refresh:
      enabled: true
